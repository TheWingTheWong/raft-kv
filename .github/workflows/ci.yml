name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: a 10x chaos sweep and the mutation check.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  deep-chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chaos sweep (40,000 seeds)
        run: npm run chaos
        env:
          CHAOS_SCALE: '10'
      - name: Mutation check
        run: npm run mutants -- 1000
